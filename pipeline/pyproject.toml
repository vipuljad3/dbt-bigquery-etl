[project]
name = "pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.19",
    "dagster-dbt>=0.29.19",
    "dagster-duckdb>=0.29.19",
    "dagster-duckdb-polars>=0.29.19",
    "dagster-polars>=0.27.12",
    "dagster-snowflake>=0.29.19",
    "dagster-snowflake-polars>=0.29.19",
    "dbt-duckdb>=1.11.0",
    "dbt-snowflake>=1.12.0",
    "duckdb>=1.5.5",
    "polars>=1.44.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"
registry_modules = [
    "pipeline.components.*",
]


